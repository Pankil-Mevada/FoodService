<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver GPS · Plated</title><link rel="stylesheet" href="driver.css"></head><body><main><p class="kicker">Delivery partner portal</p><h1>Share live GPS</h1><p>This page sends your real browser coordinates only while sharing is active.</p><form id="driver-form"><label>Order ID<input name="orderId" type="number" min="1" required></label><label>Driver location token<input name="token" type="password" required autocomplete="off"></label><label>Driver name<input name="driverName" required value="Delivery Partner"></label><label>Contact<input name="driverContact" required placeholder="Test or operational contact"></label><label>Vehicle type<input name="vehicleType" required value="Delivery scooter"></label><label>Vehicle plate<input name="vehiclePlate" required></label><label>Delivery status<select name="status"><option>ASSIGNED</option><option>PICKED_UP</option><option>ON_THE_WAY</option><option>ARRIVING</option><option>DELIVERED</option></select></label><button id="start" type="submit">Start sharing real GPS</button><button id="stop" type="button" disabled>Stop sharing</button></form><section id="status" aria-live="polite">GPS is not being shared.</section><small>Use HTTPS or localhost and allow precise location. Never share the driver token with customers.</small></main><script src="driver.js" defer></script></body></html>
