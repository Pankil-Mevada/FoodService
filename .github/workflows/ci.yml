name: FoodService CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodservice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run fast local-equivalent checks
        run: bash scripts/ci-local.sh

  build-and-e2e:
    name: build-and-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
      CI_BUILD_DIR: build-ci
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Install pinned vcpkg release
        run: |
          git clone --branch 2026.05.25 --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-ubuntu-2026.05.25-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-ubuntu-2026.05.25-

      - name: Configure, build, and run unit tests
        run: bash scripts/ci-local.sh --full

      - name: Run service-level end-to-end tests
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production
          PAYMENT_WEBHOOK_SECRET: test-webhook-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
          ORDER_SYNC_SECRET: ci-only-order-sync-secret
          DRIVER_LOCATION_TOKEN: ci-only-driver-location-token
        run: bash scripts/ci-e2e.sh "$CI_BUILD_DIR"
